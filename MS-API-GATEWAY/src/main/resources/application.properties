spring.application.name=MS-API-GATEWAY
server.port=8000

# Eureka Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=false

# Route 0: MS1
spring.cloud.gateway.routes[0].id=MS1
spring.cloud.gateway.routes[0].uri=lb://MS1
spring.cloud.gateway.routes[0].predicates[0]=Path=/ms1/**

# Route 1: MS2 with Circuit Breaker
spring.cloud.gateway.routes[1].id=MS2
spring.cloud.gateway.routes[1].uri=lb://MS2
spring.cloud.gateway.routes[1].predicates[0]=Path=/ms2/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=myCircuitBreaker,fallbackUri=forward:/fallback

# Route 2: Inventory Service with Eureka Load Balancing
spring.cloud.gateway.routes[2].id=inventory-route
spring.cloud.gateway.routes[2].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/inventory/**

# Route 3: Book Service with Eureka Load Balancing & JWT Auth Routing
spring.cloud.gateway.routes[3].id=book-service-route
spring.cloud.gateway.routes[3].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/books/**,/auth/**

# Spring Cloud Gateway CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*